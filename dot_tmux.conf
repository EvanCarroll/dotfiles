# switch to C-a (screen) from C-b
set -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

set -g mouse on

bind C new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# bind '%' split-window -h -c '#{pane_current_path}'  # Split panes horizontal
# bind '"' split-window -v -c '#{pane_current_path}'  # Split panes vertically
# bind c new-window -c '#{pane_current_path}' # Create new window

set-window-option -g mode-keys vi

# pass shift+enter (and other modified keys) through to the pane.
# extkeys tells tmux the outer terminal can report them, so it asks kitty
# to turn the protocol on; without it kitty sends a bare CR and the shift
# bit is lost before tmux ever sees it. 'always' avoids depending on the
# app to request them.
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'
