# User PATH. Single source of truth: the systemd user manager reads this
# directly; X sessions (~/.xsessionrc) and shells that didn't inherit it
# (tty, ssh) import it via ~/.config/shell/environment.sh.
PATH=$HOME/.local/bin:$HOME/bin:$HOME/.cargo/bin:$HOME/go/bin:$HOME/n/bin:$HOME/perl5/bin:$HOME/.wasmer/bin:$HOME/.wasmtime/bin:/usr/local/go/bin:$PATH
