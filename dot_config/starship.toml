# Starship prompt, initialized at the end of ~/.zshrc.
# https://starship.rs/config/
# Layout follows the old Powerlevel10k "lean" setup: one line, os/dir/git
# on the left, status and context on the right. Icons need a Nerd Font
# (FiraCode Nerd Font, from .chezmoiexternal.toml).
"$schema" = "https://starship.rs/config-schema.json"

add_newline = false

format = "$os$directory$git_branch$git_commit$git_state$git_status$character"
right_format = """
$status\
$cmd_duration\
$jobs\
$direnv\
$python\
$nodejs\
$container\
$kubernetes\
$aws\
$gcloud\
$terraform\
$username\
$hostname"""

[os]
disabled = false
style = "bold white"

[directory]
truncation_length = 4
truncate_to_repo = false
style = "bold blue"

[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "✘"
pipestatus = true

[cmd_duration]
min_time = 3_000
format = "[$duration]($style) "

[jobs]
format = "[$symbol$number]($style) "

[direnv]
disabled = false

# Shown only in an ssh session or as root, like p10k's context segment.
[username]
format = "[$user]($style)"

[hostname]
format = "[@$hostname]($style) "
