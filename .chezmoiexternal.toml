# Third-party content chezmoi fetches and keeps up to date.

[".oh-my-zsh"]
type = "git-repo"
url = "https://github.com/ohmyzsh/ohmyzsh.git"
refreshPeriod = "168h"

# kitty.conf: font_family FiraCode Nerd Font
[".local/share/fonts/FiraCodeNerdFont"]
type = "archive"
url = "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/FiraCode.tar.xz"
exact = true
refreshPeriod = "720h"
include = ["*.ttf", "LICENSE"]
